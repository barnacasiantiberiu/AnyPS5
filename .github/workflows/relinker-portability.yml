name: Relinker portability

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/relinker/**'
      - '.github/workflows/relinker-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relinker-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relinker:
    if: github.repository == 'barnacasiantiberiu/AnyPS5'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=g++-14
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/windows/Bootstrap.ps1
          . ./tools/windows/Enter-Environment.ps1 -BuildJobs 3
          $compilerBin = $AnyPS5Environment.Bin.Replace('\', '/')
          cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON "-DCMAKE_CXX_COMPILER=$compilerBin/g++.exe" "-DCMAKE_MAKE_PROGRAM=$compilerBin/ninja.exe" "-DPython3_EXECUTABLE=$AnyPS5Python"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          $AnyPS5Environment.Bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        run: cmake --build build-relinker --parallel 3
      - name: Test
        run: ctest --test-dir build-relinker --output-on-failure --parallel 2 --output-junit tests.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: relinker-${{ matrix.os }}
          path: |
            build-relinker/tests.xml
            build-relinker/Testing/Temporary/LastTest.log
            build-relinker/CMakeCache.txt
