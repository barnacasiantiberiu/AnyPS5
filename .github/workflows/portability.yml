name: Module portability

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/libs/**'
      - 'tools/test_modules.py'
      - 'tools/tests/test_module_runner.py'
      - 'tools/windows/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - '3rdparty/**'
      - '.github/workflows/portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  media:
    if: github.repository == 'barnacasiantiberiu/AnyPS5'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CTEST_PARALLEL_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check runner Python prerequisite
        shell: bash
        run: python -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10 or newer is required'; print(sys.version)"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev libx11-dev libxext-dev
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DANYPS5_VIDEO_OUT_TEST_DRIVER=offscreen
          gcc-14 --version
          cmake --version
      - name: Bootstrap and configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/windows/Bootstrap.ps1
          . ./tools/windows/Enter-Environment.ps1 -BuildJobs 3
          $compilerBin = $AnyPS5Environment.Bin.Replace('\', '/')
          & cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DCMAKE_C_COMPILER=$compilerBin/gcc.exe" "-DCMAKE_CXX_COMPILER=$compilerBin/g++.exe" "-DCMAKE_MAKE_PROGRAM=$compilerBin/ninja.exe" "-DPython3_EXECUTABLE=$AnyPS5Python" -DANYPS5_VIDEO_OUT_TEST_DRIVER=offscreen
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          $AnyPS5Environment.Bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version
          cmake --version
      - name: Validate runner and functional suites
        shell: bash
        run: |
          python tools/tests/test_module_runner.py
          python tools/test_modules.py --build-dir build --output-dir build/portability --module libSceAudioIn --module libSceContentExport --module libSceContentDelete --module libSceGameUpdate --build-target guest_audio_in_tests --build-target guest_audio_in_modes_tests --build-target guest_content_export_tests --build-target guest_content_delete_tests --build-target guest_gameupdate_tests
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: portability-${{ matrix.os }}
          path: |
            build/portability/
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
