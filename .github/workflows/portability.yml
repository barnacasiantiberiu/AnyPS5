name: Module portability

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/libs/**'
      - 'tools/test_modules.py'
      - 'tools/tests/test_module_runner.py'
      - 'tools/windows/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - '3rdparty/**'
      - '.github/workflows/portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  media:
    if: github.repository == 'barnacasiantiberiu/AnyPS5'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CTEST_PARALLEL_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check runner Python prerequisite
        shell: bash
        run: python -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10 or newer is required'; print(sys.version)"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev libx11-dev libxext-dev
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DANYPS5_VIDEO_OUT_TEST_DRIVER=offscreen
          gcc-14 --version
          cmake --version
      - name: Bootstrap and configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/windows/Bootstrap.ps1
          . ./tools/windows/Enter-Environment.ps1 -BuildJobs 3
          $compilerBin = $AnyPS5Environment.Bin.Replace('\', '/')
          & cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DCMAKE_C_COMPILER=$compilerBin/gcc.exe" "-DCMAKE_CXX_COMPILER=$compilerBin/g++.exe" "-DCMAKE_MAKE_PROGRAM=$compilerBin/ninja.exe" "-DPython3_EXECUTABLE=$AnyPS5Python" -DANYPS5_VIDEO_OUT_TEST_DRIVER=offscreen
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          $AnyPS5Environment.Bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version
          cmake --version
      - name: Validate runner and functional suites
        shell: bash
        run: |
          python tools/tests/test_module_runner.py
          python tools/test_modules.py --build-dir build --output-dir build/portability --module libSceAudioIn --module libSceContentExport --module libSceContentDelete --module libSceGameUpdate --module libSceNgs2.native --module libSceNpEntitlementAccess --module libSceAppContent --module libSceNpCommerce --build-target guest_audio_in_tests --build-target guest_audio_in_modes_tests --build-target guest_content_export_tests --build-target guest_content_delete_tests --build-target guest_gameupdate_tests --build-target ngs2_render_tests --build-target ngs2_atrac9_tests --build-target ngs2_filter_tests --build-target ngs2_custom_tests --build-target ngs2_parse_tests --build-target ngs2_stream_tests --build-target ngs2_userfx_tests --build-target ngs2_report_tests --build-target ngs2_geom_tests --build-target ngs2_core_geom_tests --build-target ngs2_core_report_tests --build-target ngs2_native_geom_apply_tests --build-target ngs2_core_geom_apply_tests --build-target guest_entitlement_tests --build-target guest_appcontent_tests --build-target guest_appcontent_addons_tests --build-target guest_commerce_tests
      - name: Build kernel signal regression tests
        shell: bash
        run: |
          cmake --build build --target guest_signal_critical_tests guest_address_signal_tests guest_raise_exception_tests guest_sync_on_address_tests guest_umtx_op_tests guest_umtx_semaphore_tests guest_cond_timedwait_tests guest_semaphore_tests
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --target guest_raise_nested_sleep_tests guest_mutex_raise_exception_tests
          fi
      - name: Validate kernel signals and address waits
        shell: bash
        run: |
          ctest --test-dir build -R '^guest_(signal_critical|address_signal|raise_exception|raise_nested_sleep|mutex_raise_exception|sync_on_address|umtx_op|umtx_semaphore|umtx_semaphore_coarse|cond_timedwait|semaphore)$' --output-on-failure --output-junit kernel-signals.xml
          ctest --test-dir build -R '^guest_address_signal$' --repeat until-fail:10 --output-on-failure --output-junit kernel-signal-stress.xml
      - name: Build graphics regressions
        shell: bash
        run: cmake --build build --target nid_patcher agc_driver_shader_signal_tests agc_driver_prepared_publication_tests agc_driver_graphics_tests agc_driver_tessellation_tests agc_driver_pixel_barycentric_emulation_tests agc_driver_layered_depth_sampling_tests
      - name: Validate packaged signal bridge
        shell: bash
        run: |
          cp build/core/libs/libs/unpatched/libkernel.prx build/signal-kernel.prx
          build/core/libs/nid_patcher libkernel --preserve-exports build/core/libs/libs/unpatched/libc.prx build/signal-kernel.prx
          if [ "$RUNNER_OS" = "Windows" ]; then
            objdump -p build/signal-kernel.prx > build/signal-exports.txt
          else
            objdump -T build/signal-kernel.prx > build/signal-exports.txt
          fi
          python -c "from pathlib import Path; s=Path('build/signal-exports.txt').read_text(); assert all(n in s for n in ('EnterSignalCriticalSection_nid_no_patch', 'LeaveSignalCriticalSection_nid_no_patch')), 'Packaged signal bridge is missing'"
      - name: Validate graphics shader interfaces
        shell: bash
        run: |
          ctest --test-dir build -R '^agc_driver_(graphics|shader_signal)$' --output-on-failure --output-junit graphics-interfaces.xml
          ctest --test-dir build -R '^agc_driver_shader_signal$' --repeat until-fail:10 --output-on-failure
      - name: Render tessellated barycentrics on Linux
        if: runner.os == 'Linux'
        env:
          ANYPS5_REQUIRE_VULKAN: '1'
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [ -f "$icd" ]; then export VK_ICD_FILENAMES="$icd"; break; fi
          done
          test -n "${VK_ICD_FILENAMES:-}"
          cat "$VK_ICD_FILENAMES"
          ctest --test-dir build -R '^agc_driver_(prepared_publication|tessellation|pixel_barycentric_emulation|layered_depth_sampling)$' --output-on-failure --output-junit graphics-render.xml
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: portability-${{ matrix.os }}
          path: |
            build/portability/
            build/signal-exports.txt
            build/graphics-interfaces.xml
            build/graphics-render.xml
            build/kernel-signals.xml
            build/kernel-signal-stress.xml
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
